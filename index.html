<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUDARAKA - Enhanced</title>

  <!-- روابط PWA -->
  <link rel="manifest" href="manifest.json">
  <script src="sw.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      background: #0d1117;
      min-height: 100vh;
      color: #c9d1d9;
    }
    h1 {color:#e94560;text-align:center;margin-top:20px;}
    .toolbar {text-align:center;margin:20px;}
    .btn {padding:10px 20px;border:none;border-radius:6px;cursor:pointer;margin:5px;}
    .btn-red{background:#e94560;color:white}
    .btn-green{background:#00b894;color:white}
    .btn-blue{background:#0984e3;color:white}
    .btn-yellow{background:#fdcb6e;color:#2d3436}
    .btn-gray{background:#636e72;color:white}
    .btn-purple{background:#6c5ce7;color:white}
    .btn-cyan{background:#00cec9;color:#2d3436}
    table{width:90%;margin:20px auto;border-collapse:collapse;color:white}
    th,td{border:1px solid #30363d;padding:8px;text-align:left}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000cc;z-index:1000;justify-content:center;align-items:center;}
    .modal.show{display:flex}
    .modal-box{background:#161b22;border-radius:12px;padding:20px;color:white;min-width:300px}
  </style>
</head>
<body>

  <h1>📊 MUDARAKA</h1>
  <div class="toolbar">
    <button class="btn btn-red" onclick="openModal()">+ Add Offer</button>
    <button class="btn btn-green" onclick="saveAllData()">Save</button>
    <button class="btn btn-blue" onclick="importData()">Import</button>
    <button class="btn btn-yellow" onclick="clearAllData()">Clear All</button>
    <button class="btn btn-gray" onclick="openPrintModal()">Print</button>
    <button class="btn btn-purple" onclick="toggleReports()">Reports</button>
    <button class="btn btn-cyan" onclick="openExcelModal()">Export Excel</button>
  </div>

  <!-- جدول البيانات -->
  <table id="dataTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Type</th>
        <th>Number</th>
        <th>Company</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- مودال إضافة سجل -->
  <div class="modal" id="modalOverlay">
    <div class="modal-box">
      <h2>Add New Record</h2>
      <form onsubmit="saveRecord(event)">
        <input type="text" id="recordType" placeholder="Type" required><br><br>
        <input type="text" id="recordNumber" placeholder="Number" required><br><br>
        <input type="text" id="recordCompany" placeholder="Company" required><br><br>
        <button type="submit" class="btn btn-green">Save Record</button>
        <button type="button" class="btn btn-gray" onclick="closeModal()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- مودال الطباعة -->
  <div class="modal" id="printModal">
    <div class="modal-box">
      <h2>Print Options</h2>
      <button class="btn btn-purple" onclick="executePrint()">Print</button>
      <button class="btn btn-gray" onclick="closePrintModal()">Close</button>
    </div>
  </div>

  <!-- قسم التقارير -->
  <div class="modal" id="reportSection">
    <div class="modal-box">
      <h2>Reports</h2>
      <p>📈 Weekly / Monthly reports will be shown here.</p>
    </div>
  </div>

  <!-- دوال JavaScript -->
  <script>
    function openModal() {
      document.getElementById("modalOverlay").classList.add("show");
    }
    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("show");
    }
    function saveRecord(event) {
      event.preventDefault();
      const type = document.getElementById("recordType").value;
      const number = document.getElementById("recordNumber").value;
      const company = document.getElementById("recordCompany").value;
      const tableBody = document.getElementById("tableBody");
      const row = document.createElement("tr");
      row.innerHTML = `<td>${tableBody.rows.length+1}</td><td>${type}</td><td>${number}</td><td>${company}</td>`;
      tableBody.appendChild(row);
      closeModal();
      alert("📝 Record saved!");
    }
    function saveAllData() {
      alert("✅ Data saved successfully!");
    }
    function importData() {
      alert("📥 Import function triggered!");
    }
    function clearAllData() {
      document.getElementById("tableBody").innerHTML = "";
      alert("🗑️ All data cleared!");
    }
    function openPrintModal() {
      document.getElementById("printModal").classList.add("show");
    }
    function closePrintModal() {
      document.getElementById("printModal").classList.remove("show");
    }
    function executePrint() {
      alert("🖨️ Print started!");
    }
    function toggleReports() {
      document.getElementById("reportSection").classList.toggle("show");
    }
    function openExcelModal() {
      alert("📊 Excel export triggered!");
    }
    function searchRecords() {
      alert("🔍 Search triggered!");
    }
    function showReport(type) {
      alert("📈 Showing " + type + " report!");
    }
    function switchLang(lang) {
      alert("🌐 Language switched to " + lang);
    }
  </script>
</body>
</html>
